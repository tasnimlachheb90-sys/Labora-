<div class="wrap">
  <aside class="side">
    <h3>Filtre</h3>
    <select [(ngModel)]="selected" (ngModelChange)="onFilter()">
      <option value="">Toutes catégories</option>
      @for (c of categories; track c) {
        <option [value]="c">{{ c }}</option>
      }
    </select>
  </aside>

  <div #calEl class="cal"></div>
</div>
